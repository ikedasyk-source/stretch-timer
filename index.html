<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#0a1628"/>
  <title>STRETCH TIMER</title>
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="STRETCH">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --hold:   #00c9a7;
      --relax:  #74b9ff;
      --done:   #a29bfe;
      --text:   #f0f0f0;
      --muted:  rgba(255,255,255,0.45);
      --line:   rgba(255,255,255,0.08);
      --surface: rgba(255,255,255,0.04);
      --surface2: rgba(255,255,255,0.07);
      --radius: 16px;
      --bg: #0a1628;
    }

    *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    html, body { min-height: 100%; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      color: var(--text);
      font-family: 'Noto Sans JP', -apple-system, sans-serif;
      background-color: var(--bg);
      background-image:
        radial-gradient(ellipse at 20% 10%, rgba(0,201,167,0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(116,185,255,0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(10,22,40,1) 0%, transparent 100%),
        repeating-linear-gradient(135deg, rgba(255,255,255,.025) 0px, rgba(255,255,255,.025) 1px, transparent 1px, transparent 6px),
        repeating-linear-gradient(45deg,  rgba(255,255,255,.025) 0px, rgba(255,255,255,.025) 1px, transparent 1px, transparent 6px);
      background-size: 100% 100%, 100% 100%, 100% 100%, 10px 10px, 10px 10px;
      overflow-x: hidden;
    }

    button, select { font: inherit; cursor: pointer; }
    button { user-select: none; }
    button:active { transform: scale(.97); }

    .app {
      width: min(440px, 100%);
      margin: 0 auto;
      padding: max(16px, env(safe-area-inset-top)) 14px max(20px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100svh;
    }

    .hidden { display: none !important; }

    /* ── LOGO ── */
    .logo {
      text-align: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(48px, 13vw, 66px);
      font-weight: 400;
      letter-spacing: .25em;
      background: linear-gradient(135deg, #00c9a7, #74b9ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 20px rgba(0,201,167,0.35));
      line-height: 1;
      margin-bottom: 16px;
    }

    /* ── PANEL ── */
    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      backdrop-filter: blur(12px);
    }

    /* ── SELECT ── */
    .select-wrap { position: relative; margin-bottom: 10px; }
    .select-wrap::after {
      content: '⌄';
      position: absolute; right: 16px; top: 50%;
      transform: translateY(-58%);
      color: var(--hold); font-size: 28px; pointer-events: none;
    }
    select {
      width: 100%; appearance: none; -webkit-appearance: none;
      border: 1px solid rgba(0,201,167,0.4);
      background: rgba(0,201,167,0.06);
      color: #fff; border-radius: var(--radius);
      padding: 14px 48px 14px 16px;
      font-size: 17px; font-weight: 700; outline: none;
    }

    /* ── LEVELS ── */
    .levels {
      display: grid; grid-template-columns: repeat(3,1fr);
      overflow: hidden; border-radius: var(--radius);
      margin-bottom: 10px;
      border: 1px solid var(--line);
    }
    .levels button {
      border: none; border-right: 1px solid var(--line);
      background: var(--surface);
      color: rgba(255,255,255,.45);
      padding: 11px 0; font-size: 12px; font-weight: 700;
      letter-spacing: .08em;
      transition: background .2s, color .2s;
    }
    .levels button:last-child { border-right: none; }
    .levels button.active {
      background: linear-gradient(135deg, rgba(0,201,167,0.25), rgba(116,185,255,0.2));
      color: var(--hold);
      box-shadow: inset 0 0 20px rgba(0,201,167,0.1);
    }

    /* ── SUMMARY ── */
    .summary {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 8px; margin-bottom: 10px;
    }
    .summary-card {
      text-align: center; padding: 10px 4px 8px;
      border-radius: 12px;
    }
    .summary-card .s-label {
      font-size: 10px; color: var(--muted);
      letter-spacing: .1em; margin-bottom: 4px;
      font-weight: 700;
    }
    .summary-card input[type="number"] {
      width: 100%; background: transparent; border: none;
      border-bottom: 1px solid rgba(255,255,255,.12);
      color: #fff; text-align: center;
      font-size: 28px; font-weight: 900; line-height: 1;
      outline: none; -moz-appearance: textfield;
      padding: 2px 0; font-family: 'Bebas Neue', sans-serif;
      letter-spacing: .05em;
    }
    .summary-card input[type="number"]::-webkit-inner-spin-button,
    .summary-card input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
    .summary-card input[type="number"]:focus { border-bottom-color: var(--hold); }
    .summary-card .s-unit { font-size: 10px; color: var(--muted); margin-top: 4px; }
    .s-total { font-size: 10px; color: var(--muted); text-align: center; margin-bottom: 10px; letter-spacing: .05em; }

    /* ── GUIDE IMAGE ── */
    .guide-card { margin-bottom: 10px; overflow: hidden; border-radius: var(--radius); }
    .guide-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      font-size: 12px; color: var(--muted);
    }
    .guide-head strong { color: #fff; font-size: 13px; }
    .guide-image-wrap { background: rgba(255,255,255,.02); padding: 8px; }
    .guide-image {
      width: 100%; display: block; border-radius: 10px;
      border: 1px solid rgba(255,255,255,.06);
      cursor: zoom-in;
      max-height: 190px; object-fit: cover; object-position: top center;
      background: rgba(255,255,255,.03);
    }
    .guide-note { padding: 6px 12px 10px; color: var(--muted); font-size: 11px; text-align: center; }

    /* ── SIDE BADGE（左右表示） ── */
    .side-badge {
      display: none;
      margin: 0 8px 8px;
      padding: 6px 14px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(0,201,167,0.15), rgba(116,185,255,0.1));
      border: 1px solid rgba(0,201,167,0.3);
      color: var(--hold);
      font-size: 12px; font-weight: 700;
      text-align: center; letter-spacing: .1em;
    }
    .side-badge.visible { display: block; }

    /* ── START ── */
    .start-btn {
      width: 100%; height: 64px;
      border: 1px solid rgba(0,201,167,0.5); border-radius: var(--radius);
      background: linear-gradient(135deg, #00c9a7, #0097a7);
      color: #fff; font-size: 22px; font-weight: 900;
      letter-spacing: .3em;
      font-family: 'Bebas Neue', sans-serif;
      text-shadow: 0 1px 0 rgba(0,0,0,.2);
      box-shadow: 0 0 28px rgba(0,201,167,0.25), inset 0 1px 0 rgba(255,255,255,.15);
      margin-bottom: 10px;
      transition: box-shadow .2s;
    }
    .start-btn:active {
      box-shadow: 0 0 10px rgba(0,201,167,0.2);
    }

    /* ── SOUND ── */
    .sound { padding: 12px; margin-bottom: 0; border-radius: var(--radius); }
    .sound-title { font-size: 13px; font-weight: 700; color: #fff; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .sound-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; }
    .sound-block { text-align: center; border-right: 1px solid var(--line); padding-right: 6px; }
    .sound-block:last-child { border-right: none; padding-right: 0; }
    .sound-label { font-size: 10px; color: var(--muted); margin-bottom: 6px; }
    .sound-block select {
      font-size: 11px; padding: 6px 18px 6px 8px;
      border-color: rgba(255,255,255,.1); border-radius: 8px;
      background: rgba(0,0,0,0.3);
    }

    /* ── BGM TOGGLE ── */
    .bgm-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 2px 10px; 
    }
    .toggle-switch { position: relative; display: inline-block; width: 44px; height: 24px; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .toggle-track {
      position: absolute; inset: 0;
      background: rgba(255,255,255,.12); border-radius: 12px;
      transition: background .25s;
      cursor: pointer;
    }
    .toggle-track::before {
      content: '';
      position: absolute; left: 3px; top: 3px;
      width: 18px; height: 18px; border-radius: 50%;
      background: #fff;
      transition: transform .25s;
    }
    .toggle-switch input:checked + .toggle-track { background: var(--hold); }
    .toggle-switch input:checked + .toggle-track::before { transform: translateX(20px); }

    /* ── FOOTER ── */
    .footer {
      text-align: center; color: rgba(255,255,255,.3);
      font-size: 11px; letter-spacing: .35em;
      padding-top: 16px; padding-bottom: 4px;
    }

    /* ======= TIMER SCREEN ======= */
    #runScreen {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh; min-height: 100svh;
      gap: 10px; padding: 24px 16px 40px;
    }

    .run-exercise {
      font-size: 11px; letter-spacing: .3em;
      color: var(--muted); text-align: center;
      text-transform: uppercase;
      font-weight: 700;
    }

    .run-side-label {
      font-size: 13px; font-weight: 700;
      letter-spacing: .2em;
      color: var(--hold);
      background: rgba(0,201,167,0.1);
      border: 1px solid rgba(0,201,167,0.25);
      padding: 4px 16px; border-radius: 20px;
      opacity: 0;
      transition: opacity .3s;
    }
    .run-side-label.visible { opacity: 1; }

    .phase-label {
      font-size: 14px; font-weight: 900;
      letter-spacing: .5em;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
    }
    .phase-label.hold { color: var(--hold); text-shadow: 0 0 16px rgba(0,201,167,.5); }
    .phase-label.relax { color: var(--relax); text-shadow: 0 0 16px rgba(116,185,255,.5); }

    /* Ring */
    .ring-wrap {
      position: relative;
      width: min(70vw, 280px);
      aspect-ratio: 1;
      display: grid; place-items: center;
    }
    .ring-svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
    .ring-track { fill: none; stroke: rgba(255,255,255,.06); stroke-width: 12; }
    .ring-prog {
      fill: none; stroke-width: 12; stroke-linecap: round;
      transition: stroke-dashoffset .95s linear, stroke .3s ease, filter .3s ease;
    }
    .time-big {
      position: absolute;
      font-size: clamp(64px, 16vw, 96px);
      font-weight: 900; letter-spacing: -.03em;
      font-family: 'Bebas Neue', sans-serif;
    }
    .time-big.hold { color: var(--hold); }
    .time-big.relax { color: var(--relax); }
    .blink { animation: blink .5s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: .3; } }

    /* Sets */
    .sets-row {
      display: flex; align-items: baseline; gap: 4px;
    }
    .sets-label { font-size: 11px; letter-spacing: .4em; color: var(--muted); font-weight: 700; }
    .sets-count { font-size: clamp(32px, 8vw, 48px); font-weight: 900; color: #fff; min-width: 2ch; text-align: center; font-family: 'Bebas Neue', sans-serif; }
    .sets-total { font-size: 14px; color: var(--muted); font-weight: 300; }

    /* Toast */
    .toast {
      padding: 10px 18px;
      border: 1px solid rgba(255,255,255,.08); border-radius: 10px;
      color: rgba(255,255,255,.7); text-align: center;
      font-size: 12px; line-height: 1.5;
      background: rgba(10,22,40,.8);
      opacity: 0; transform: translateY(6px);
      transition: .2s ease;
      width: min(300px, 86vw);
      min-height: 42px;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    /* Controls */
    .run-controls { display: flex; gap: 12px; }
    .run-btn {
      height: 50px; padding: 0 24px;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.1);
      color: rgba(255,255,255,.45); border-radius: 10px;
      font-size: 14px; font-weight: 900; letter-spacing: .2em;
      font-family: 'Bebas Neue', sans-serif;
      transition: border-color .2s, color .2s;
    }
    .run-btn.active-hold { color: var(--hold); border-color: rgba(0,201,167,.4); }
    .run-btn.active-relax { color: var(--relax); border-color: rgba(116,185,255,.4); }

    /* ── IMAGE MODAL ── */
    .modal {
      position: fixed; inset: 0; z-index: 20;
      background: rgba(0,0,0,.9);
      display: none; align-items: center; justify-content: center;
      padding: 14px;
    }
    .modal.show { display: flex; }
    .modal-inner { width: min(100%, 900px); max-height: 92svh; position: relative; }
    .modal img { width: 100%; max-height: 92svh; object-fit: contain; display: block; border-radius: 12px; background: #fff; }
    .modal-close {
      position: absolute; top: -10px; right: -6px;
      width: 40px; height: 40px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,.2);
      background: rgba(0,0,0,.8); color: #fff; font-size: 22px; line-height: 1;
    }

    /* ── COMPLETE MODAL ── */
    .complete-box {
      width: min(320px, 88vw);
      border: 1px solid rgba(0,201,167,.4);
      border-radius: 20px;
      background: rgba(10,22,40,.97);
      padding: 28px 20px 22px; text-align: center;
      box-shadow: 0 0 48px rgba(0,201,167,.15);
    }
    .complete-box h2 {
      font-family: 'Bebas Neue', sans-serif;
      background: linear-gradient(135deg, #00c9a7, #74b9ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-size: 32px; letter-spacing: .2em; margin-bottom: 10px;
    }
    .complete-box p { color: var(--muted); line-height: 1.8; margin-bottom: 20px; font-size: 14px; white-space: pre-line; }
    .complete-box button {
      width: 100%; height: 50px; border: none; border-radius: 12px;
      background: linear-gradient(135deg, #00c9a7, #0097a7);
      color: #fff; font-size: 18px; font-weight: 900; letter-spacing: .2em;
      font-family: 'Bebas Neue', sans-serif;
    }

    @media (max-height: 750px) {
      .logo { font-size: 40px; margin-bottom: 10px; }
      select { padding: 10px 48px 10px 16px; font-size: 15px; }
      .levels button { padding: 8px 0; }
      .summary-card input[type="number"] { font-size: 22px; }
      .guide-image { max-height: 130px; }
      .start-btn { height: 54px; font-size: 20px; }
      .footer { padding-top: 10px; }
    }
  </style>
</head>
<body>
<main class="app">

  <!-- ===== SETTINGS ===== -->
  <section id="settingsScreen">
    <div class="logo">STRETCH</div>

    <div class="select-wrap">
      <select id="exerciseSelect"></select>
    </div>

    <div class="levels panel" id="levelButtons">
      <button data-level="easy">EASY</button>
      <button data-level="normal" class="active">NORMAL</button>
      <button data-level="deep">DEEP</button>
    </div>

    <div class="summary">
      <div class="summary-card panel">
        <div class="s-label">HOLD</div>
        <input type="number" id="inpWork" min="1" max="999" value="30">
        <div class="s-unit">秒</div>
      </div>
      <div class="summary-card panel">
        <div class="s-label">RELAX</div>
        <input type="number" id="inpRest" min="1" max="999" value="10">
        <div class="s-unit">秒</div>
      </div>
      <div class="summary-card panel">
        <div class="s-label">SET</div>
        <input type="number" id="inpSets" min="1" max="99" value="1">
        <div class="s-unit" id="totalTimeLabel">1分</div>
      </div>
    </div>
    <div class="s-total" id="totalTimeDetail"></div>

    <div class="guide-card panel">
      <div class="guide-head">
        <strong>フォーム確認</strong>
        <span>タップで拡大</span>
      </div>
      <div class="guide-image-wrap">
        <img id="guideImage" class="guide-image" src="" alt="ストレッチのやり方">
      </div>
      <div class="side-badge" id="sideBadge">左右各30秒 × 自動切替</div>
      <div class="guide-note" id="guideNote">種目を選択してフォームを確認</div>
    </div>

    <button class="start-btn" id="startBtn">START</button>

    <div class="sound panel">
      <div class="sound-title"><span style="color:var(--hold)">▻</span> サウンド設定</div>
      <div class="bgm-row">
        <span style="font-size:12px;font-weight:700;color:var(--text);">BGM</span>
        <label class="toggle-switch">
          <input type="checkbox" id="bgmToggle" checked>
          <span class="toggle-track"></span>
        </label>
      </div>
      <div class="sound-grid">
        <div class="sound-block">
          <div class="sound-label">HOLD終了</div>
          <select id="sndWork">
            <option value="beep" selected>ビープ</option>
            <option value="bell">ベル</option>
            <option value="blip">ブリップ</option>
            <option value="none">なし</option>
          </select>
        </div>
        <div class="sound-block">
          <div class="sound-label">RELAX終了</div>
          <select id="sndRest">
            <option value="beep">ビープ</option>
            <option value="bell" selected>ベル</option>
            <option value="blip">ブリップ</option>
            <option value="none">なし</option>
          </select>
        </div>
        <div class="sound-block">
          <div class="sound-label">完了</div>
          <select id="sndDone">
            <option value="fanfare" selected>ファンファーレ</option>
            <option value="bell">ベル</option>
            <option value="beep">ビープ</option>
            <option value="none">なし</option>
          </select>
        </div>
      </div>
    </div>

    <div class="footer">actcreation-lab.com</div>
  </section>

  <!-- ===== TIMER ===== -->
  <section id="runScreen" class="hidden">
    <div class="run-exercise" id="runExercise"></div>
    <div class="run-side-label" id="runSideLabel"></div>
    <div class="phase-label hold" id="phaseLabel">HOLD</div>

    <div class="ring-wrap">
      <svg class="ring-svg" viewBox="0 0 220 220" aria-hidden="true">
        <circle class="ring-track" cx="110" cy="110" r="92"/>
        <circle class="ring-prog" id="ringProg" cx="110" cy="110" r="92"/>
      </svg>
      <div class="time-big hold" id="timeBig">30</div>
    </div>

    <div class="sets-row">
      <span class="sets-label">SET&nbsp;</span>
      <span class="sets-count" id="setsCount">1</span>
      <span class="sets-total" id="setsTotal">&nbsp;/ 1</span>
    </div>

    <div class="toast" id="toast">まもなく切り替わります</div>

    <div class="run-controls">
      <button class="run-btn active-hold" id="pauseBtn" onclick="togglePause()">PAUSE</button>
      <button class="run-btn" onclick="stopTimer()">STOP</button>
    </div>

    <div class="footer">actcreation-lab.com</div>
  </section>

</main>

<!-- IMAGE MODAL -->
<div id="imageModal" class="modal">
  <div class="modal-inner">
    <button class="modal-close" id="modalClose">×</button>
    <img id="modalImage" src="" alt="拡大">
  </div>
</div>

<!-- COMPLETE MODAL -->
<div id="completeModal" class="modal">
  <div class="complete-box">
    <h2>COMPLETE</h2>
    <p id="completeMsg">全セット完了！<br>お疲れさまでした。</p>
    <button id="completeOk">OK</button>
  </div>
</div>

<script>
// ── exercises ──
// bilateral: true → 左右各holdSec秒で自動切替（合計holdSec×2）
const exercises = {
  "ニー・トゥ・チェスト＋スパイナルロッキング": {
    image: "kneestochest.png",
    bilateral: false,
    presets: {
      easy:   { work: 20, rest: 10, sets: 1 },
      normal: { work: 30, rest: 10, sets: 1 },
      deep:   { work: 45, rest: 15, sets: 2 },
    }
  },
  "キャット・カウストレッチ": {
    image: "catcowstretch.png",
    bilateral: false,
    presets: {
      easy:   { work: 30, rest: 10, sets: 1 },
      normal: { work: 40, rest: 10, sets: 1 },
      deep:   { work: 60, rest: 15, sets: 2 },
    }
  },
  "ランジストレッチ（腸腰筋）": {
    image: "lowlunge.png",
    bilateral: true,
    presets: {
      easy:   { work: 20, rest: 10, sets: 1 },
      normal: { work: 30, rest: 10, sets: 1 },
      deep:   { work: 45, rest: 15, sets: 2 },
    }
  },
  "フロントプランク": {
    image: "frontplank.png",
    bilateral: false,
    presets: {
      easy:   { work: 20, rest: 10, sets: 1 },
      normal: { work: 30, rest: 10, sets: 1 },
      deep:   { work: 45, rest: 15, sets: 2 },
    }
  },
  "チェストオープナー": {
    image: "chestopenerstrech.png",
    bilateral: false,
    presets: {
      easy:   { work: 20, rest: 10, sets: 1 },
      normal: { work: 30, rest: 10, sets: 1 },
      deep:   { work: 45, rest: 15, sets: 2 },
    }
  },
};

const IMAGE_FOLDER = "";
const CIRCUM = 2 * Math.PI * 92;

// ── State ──
const state = {
  exercise: "ニー・トゥ・チェスト＋スパイナルロッキング",
  level: "normal",
  phase: "work",        // "work" | "rest"
  sidePhase: "left",    // "left" | "right"（bilateral用）
  currentSet: 1,
  totalSets: 1,
  workSec: 30, restSec: 10,
  remaining: 30, duration: 30,
  running: false, timer: null,
  audioCtx: null,
  isBilateral: false,
  inRightSide: false,   // bilateral: 右側フェーズか
};

const $ = id => document.getElementById(id);

// ── Build select ──
Object.keys(exercises).forEach(name => {
  const opt = document.createElement("option");
  opt.value = name; opt.textContent = name;
  $("exerciseSelect").appendChild(opt);
});

// ── Format ──
function formatTime(sec) {
  const m = Math.floor(sec / 60), s = sec % 60;
  if (m === 0) return `${s}秒`;
  return s === 0 ? `${m}分` : `${m}分${s}秒`;
}

function calcTotal(w, r, sets, bilateral) {
  if (bilateral) return (w * 2 + r) * sets;
  return (w + r) * sets;
}

// ── Update settings view ──
function updateSettingsView() {
  const ex = exercises[state.exercise];
  const p = ex.presets[state.level];
  $("inpWork").value = p.work;
  $("inpRest").value = p.rest;
  $("inpSets").value = p.sets;
  updateTotalLabel();

  document.querySelectorAll("#levelButtons button").forEach(btn =>
    btn.classList.toggle("active", btn.dataset.level === state.level)
  );

  const img = $("guideImage");
  img.src = IMAGE_FOLDER + ex.image;
  img.alt = state.exercise + "のやり方";
  $("guideNote").textContent = state.exercise + "のフォームを確認";

  // 左右バッジ
  const badge = $("sideBadge");
  if (ex.bilateral) {
    badge.textContent = `左右各${p.work}秒 × 自動切替`;
    badge.classList.add("visible");
  } else {
    badge.classList.remove("visible");
  }
}

function updateTotalLabel() {
  const w = parseInt($("inpWork").value) || 0;
  const r = parseInt($("inpRest").value) || 0;
  const s = parseInt($("inpSets").value) || 0;
  const ex = exercises[state.exercise];
  const total = calcTotal(w, r, s, ex.bilateral);
  $("totalTimeLabel").textContent = formatTime(total);
}

["inpWork","inpRest","inpSets"].forEach(id => {
  $(id).addEventListener("input", updateTotalLabel);
});

// ── Sound ──
function addSoundPreview(selectId) {
  $(selectId).addEventListener("change", e => playSound(e.target.value));
}
addSoundPreview("sndWork");
addSoundPreview("sndRest");
addSoundPreview("sndDone");

function initAudio() {
  if (!state.audioCtx) state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (state.audioCtx.state === "suspended") state.audioCtx.resume();
}
function unlockAudio() {
  initAudio();
  const buf = state.audioCtx.createBuffer(1,1,22050);
  const src = state.audioCtx.createBufferSource();
  src.buffer = buf; src.connect(state.audioCtx.destination); src.start(0);
}
function tone(freq, dur, type="sine", delay=0, vol=0.4) {
  if (!state.audioCtx) return;
  const ctx = state.audioCtx;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, ctx.currentTime + delay);
  g.gain.setValueAtTime(0.0001, ctx.currentTime + delay);
  g.gain.exponentialRampToValueAtTime(vol, ctx.currentTime + delay + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + delay + dur);
  o.connect(g).connect(ctx.destination);
  o.start(ctx.currentTime + delay);
  o.stop(ctx.currentTime + delay + dur + 0.02);
}
function playSound(name) {
  if (name === "none") return;
  initAudio();
  if (navigator.vibrate) navigator.vibrate(60);
  if (name === "beep")    { tone(880,.15); tone(880,.15,undefined,.2); }
  if (name === "bell")    { tone(660,.18); tone(990,.22,undefined,.18); }
  if (name === "blip")    { tone(520,.08,"square"); tone(740,.08,"square",.1); }
  if (name === "fanfare") { tone(523,.14); tone(659,.14,undefined,.16); tone(784,.28,undefined,.32); }
}

// ── BGM ──
const BGM = {
  ctx: null,
  gainNode: null,
  nodes: [],
  current: null, // 'hold' | 'relax' | null
};

function getBgmCtx() {
  if (!BGM.ctx) BGM.ctx = state.audioCtx;
  return BGM.ctx;
}

function stopAllBgmNodes() {
  BGM.nodes.forEach(n => { try { n.stop(); } catch(e){} });
  BGM.nodes = [];
}

// フェードアウトして停止
function stopBGM(cb) {
  if (!BGM.gainNode) { if(cb) cb(); return; }
  const ctx = BGM.ctx;
  const g = BGM.gainNode;
  const now = ctx.currentTime;
  g.gain.cancelScheduledValues(now);
  g.gain.setValueAtTime(g.gain.value, now);
  g.gain.linearRampToValueAtTime(0.0001, now + 0.8);
  setTimeout(() => {
    stopAllBgmNodes();
    BGM.gainNode = null;
    BGM.current = null;
    if(cb) cb();
  }, 850);
}

// 瞑想BGM（HOLD用）: ゆったりした倍音シネ
function startMeditationBGM() {
  const ctx = getBgmCtx();
  if (!ctx) return;
  const master = ctx.createGain();
  master.gain.setValueAtTime(0.0001, ctx.currentTime);
  master.gain.linearRampToValueAtTime(0.12, ctx.currentTime + 0.8);
  master.connect(ctx.destination);
  BGM.gainNode = master;
  BGM.current = 'hold';

  // ドローン和音: 基音+5度+オクターブ
  const freqs = [110, 165, 220, 330];
  freqs.forEach((f, i) => {
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(f, ctx.currentTime);
    // ゆっくり揺れるビブラート
    const lfo = ctx.createOscillator();
    const lfoG = ctx.createGain();
    lfo.frequency.value = 0.08 + i * 0.03;
    lfoG.gain.value = 0.5;
    lfo.connect(lfoG);
    lfoG.connect(o.frequency);
    lfo.start();
    BGM.nodes.push(lfo);

    g.gain.value = [0.35, 0.2, 0.25, 0.12][i];
    o.connect(g).connect(master);
    o.start();
    BGM.nodes.push(o);
  });

  // ボウル鐘っぽいパルス（8秒周期）
  function bowlPulse() {
    if (BGM.current !== 'hold') return;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'sine';
    o.frequency.value = 432;
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.linearRampToValueAtTime(0.07, ctx.currentTime + 0.1);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 4);
    o.connect(g).connect(master);
    o.start();
    o.stop(ctx.currentTime + 4.5);
    setTimeout(bowlPulse, 8000);
  }
  bowlPulse();
}

// 川のせせらぎBGM（RELAX用）: ホワイトノイズ＋ゆらぎフィルター
function startRiverBGM() {
  const ctx = getBgmCtx();
  if (!ctx) return;
  const master = ctx.createGain();
  master.gain.setValueAtTime(0.0001, ctx.currentTime);
  master.gain.linearRampToValueAtTime(0.18, ctx.currentTime + 0.8);
  master.connect(ctx.destination);
  BGM.gainNode = master;
  BGM.current = 'relax';

  // ホワイトノイズ生成
  const bufSize = ctx.sampleRate * 3;
  const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource();
  noise.buffer = buf;
  noise.loop = true;

  // バンドパスフィルター（川っぽい帯域）
  const bpf = ctx.createBiquadFilter();
  bpf.type = 'bandpass';
  bpf.frequency.value = 800;
  bpf.Q.value = 0.4;

  // ゆらぎLFO（周波数をゆっくり動かす）
  const lfo = ctx.createOscillator();
  const lfoG = ctx.createGain();
  lfo.frequency.value = 0.15;
  lfoG.gain.value = 300;
  lfo.connect(lfoG);
  lfoG.connect(bpf.frequency);
  lfo.start();
  BGM.nodes.push(lfo);

  noise.connect(bpf).connect(master);
  noise.start();
  BGM.nodes.push(noise);

  // さらにハイパスで自然感
  const hpf = ctx.createBiquadFilter();
  hpf.type = 'highpass';
  hpf.frequency.value = 400;
  const noise2 = ctx.createBufferSource();
  noise2.buffer = buf;
  noise2.loop = true;
  const g2 = ctx.createGain();
  g2.gain.value = 0.3;
  noise2.connect(hpf).connect(g2).connect(master);
  noise2.start();
  BGM.nodes.push(noise2);
}

function startBGM(phase) {
  if (!$("bgmToggle").checked) return;
  initAudio();
  BGM.ctx = state.audioCtx;
  if (BGM.current === phase) return;
  if (BGM.current) {
    stopBGM(() => {
      if (phase === 'hold') startMeditationBGM();
      else startRiverBGM();
    });
  } else {
    if (phase === 'hold') startMeditationBGM();
    else startRiverBGM();
  }
}

// ── Level buttons ──
document.querySelectorAll("#levelButtons button").forEach(btn => {
  btn.addEventListener("click", () => {
    state.level = btn.dataset.level;
    updateSettingsView();
  });
});

// ── Exercise select ──
$("exerciseSelect").addEventListener("change", e => {
  state.exercise = e.target.value;
  updateSettingsView();
});

// ── Guide image tap to zoom ──
$("guideImage").addEventListener("click", () => {
  $("modalImage").src = $("guideImage").src;
  $("imageModal").classList.add("show");
});
$("modalClose").addEventListener("click", () => $("imageModal").classList.remove("show"));
$("imageModal").addEventListener("click", e => {
  if (e.target.id === "imageModal") $("imageModal").classList.remove("show");
});

// ── Start ──
$("startBtn").addEventListener("click", () => {
  unlockAudio();
  state.exercise   = $("exerciseSelect").value;
  state.workSec    = Math.max(1, parseInt($("inpWork").value) || 30);
  state.restSec    = Math.max(1, parseInt($("inpRest").value) || 10);
  state.totalSets  = Math.max(1, parseInt($("inpSets").value) || 1);
  state.isBilateral = exercises[state.exercise].bilateral;
  state.currentSet = 1;
  state.phase      = "work";
  state.inRightSide = false;
  state.duration   = state.workSec;
  state.remaining  = state.workSec;

  $("settingsScreen").classList.add("hidden");
  $("runScreen").classList.remove("hidden");
  $("runExercise").textContent = state.exercise;
  $("setsTotal").textContent = " / " + state.totalSets;
  updateRunView();
  startTick();
  startBGM('hold');
});

// ── Timer ──
function startTick() {
  if (state.running) return;
  state.running = true;
  state.timer = setInterval(tick, 1000);
}

function tick() {
  if (state.remaining > 0) {
    state.remaining--;
    updateRunView();
    if (state.remaining === 0) nextPhase();
  }
}

function nextPhase() {
  if (state.phase === "work") {
    // bilateral: 左が終わったら右へ
    if (state.isBilateral && !state.inRightSide) {
      playSound($("sndWork").value);
      state.inRightSide = true;
      state.duration  = state.workSec;
      state.remaining = state.workSec;
      updateRunView();
      return;
    }
    // work終了 → restへ（最終セットなら完了）
    if (state.currentSet >= state.totalSets) { finishAll(); return; }
    playSound($("sndWork").value);
    state.phase = "rest";
    state.inRightSide = false;
    state.duration  = state.restSec;
    state.remaining = state.restSec;
    startBGM('relax');
  } else {
    // rest終了 → 次のセットへ
    playSound($("sndRest").value);
    state.currentSet++;
    state.phase = "work";
    state.inRightSide = false;
    state.duration  = state.workSec;
    state.remaining = state.workSec;
    startBGM('hold');
  }
  updateRunView();
}

function finishAll() {
  clearInterval(state.timer); state.timer = null; state.running = false;
  stopBGM();
  playSound($("sndDone").value);
  $("completeMsg").textContent = state.exercise + "\n全" + state.totalSets + "セット完了！\nお疲れさまでした。";
  $("completeModal").classList.add("show");
}

function togglePause() {
  if (state.running) {
    clearInterval(state.timer); state.timer = null; state.running = false;
    stopBGM();
    $("pauseBtn").textContent = "RESUME";
    $("pauseBtn").className = "run-btn";
  } else {
    startTick();
    startBGM(state.phase === "work" ? 'hold' : 'relax');
    $("pauseBtn").textContent = "PAUSE";
    $("pauseBtn").className = "run-btn active-" + (state.phase === "work" ? "hold" : "relax");
  }
}

function stopTimer() {
  clearInterval(state.timer); state.timer = null; state.running = false;
  stopBGM();
  $("runScreen").classList.add("hidden");
  $("settingsScreen").classList.remove("hidden");
  updateSettingsView();
}

$("completeOk").addEventListener("click", () => {
  $("completeModal").classList.remove("show");
  $("runScreen").classList.add("hidden");
  $("settingsScreen").classList.remove("hidden");
  updateSettingsView();
});

// ── Ring ──
const ringProg = $("ringProg");
ringProg.style.strokeDasharray = CIRCUM;

function updateRunView() {
  const isWork = state.phase === "work";
  const ratio = state.duration ? state.remaining / state.duration : 0;
  const color = isWork ? "var(--hold)" : "var(--relax)";
  const glow  = isWork
    ? "drop-shadow(0 0 10px rgba(0,201,167,.6))"
    : "drop-shadow(0 0 10px rgba(116,185,255,.55))";

  ringProg.style.strokeDashoffset = CIRCUM * (1 - ratio);
  ringProg.style.stroke  = color;
  ringProg.style.filter  = glow;

  const timeEl = $("timeBig");
  timeEl.textContent = state.remaining;
  const phaseClass = isWork ? "hold" : "relax";
  timeEl.className = "time-big " + phaseClass + (state.remaining <= 3 && state.remaining > 0 ? " blink" : "");

  const label = $("phaseLabel");
  if (isWork) {
    if (state.isBilateral) {
      label.textContent = state.inRightSide ? "RIGHT" : "LEFT";
    } else {
      label.textContent = "HOLD";
    }
    label.className = "phase-label hold";
  } else {
    label.textContent = "RELAX";
    label.className = "phase-label relax";
  }

  // 左右ラベル（タイマー画面）
  const sideLabel = $("runSideLabel");
  if (isWork && state.isBilateral) {
    sideLabel.textContent = state.inRightSide ? "右側" : "左側";
    sideLabel.classList.add("visible");
  } else {
    sideLabel.classList.remove("visible");
  }

  $("setsCount").textContent = state.currentSet;

  const pauseBtn = $("pauseBtn");
  if (state.running) pauseBtn.className = "run-btn active-" + phaseClass;

  $("toast").classList.toggle("show", state.remaining <= 3 && state.remaining > 0);
}

// ── Init ──
updateSettingsView();
</script>
</body>
</html>
